    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@200..800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      // 在应用挂载前同步主题背景，避免闪烁（与 useColorMode 保持一致）
      (function () {
        var pref = null;
        try { pref = localStorage.getItem('themePreference'); } catch (e) {}
        var dark = pref ? pref === 'darkTheme' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.style.backgroundColor = dark ? '#07080a' : '#f2f1ec';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
